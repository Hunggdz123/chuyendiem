<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chuyển điểm thành công</title>
    <link rel="icon" type="image/png" href="images/LLwin-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .result-card {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 520px;
        margin: auto;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 24px;
        box-shadow: 0 24px 70px var(--shadow);
        backdrop-filter: blur(14px);
        overflow: hidden;
      }

      .result-header {
        padding: 26px 24px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .brand-logo-result {
        width: min(100%, 224px);
        height: auto;
        display: block;
        filter: drop-shadow(0 5px 12px rgba(31, 98, 255, 0.12));
      }

      .success-title {
        font-size: clamp(1.4rem, 3vw, 1.8rem);
        font-weight: 700;
        color: var(--title);
        margin: 18px 0 0;
        line-height: 1.3;
        letter-spacing: -0.035em;
        font-family: 'Be Vietnam Pro', sans-serif;
        text-align: center;
      }

      .result-date {
        font-size: 0.82rem;
        margin: 8px 0 0;
        color: var(--muted);
        font-weight: 400;
        text-align: center;
      }

      .result-list {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 0 28px;
      }

      .result-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        min-height: 54px;
        padding: 12px 15px;
        border: 1px solid var(--border);
        border-radius: 13px;
        background: var(--field);
        font-size: 0.88rem;
      }

      .result-row .label {
        color: var(--muted);
        font-weight: 400;
      }

      .result-row .value {
        color: var(--title);
        font-weight: 700;
        text-align: right;
        overflow-wrap: anywhere;
      }

      .result-row .value.red {
        color: var(--primary);
      }

      .result-msg {
        padding: 20px 18px;
        font-size: 0.9rem;
        text-align: center;
        color: var(--muted);
        font-weight: 400;
      }

      .result-footer {
        width: calc(100% - 56px);
        min-height: 56px;
        margin: 0 28px 28px;
        padding: 14px 16px;
        border-radius: 13px;
        background: linear-gradient(135deg, #3478f6 0%, #155ee8 100%);
        color: white;
        text-align: center;
        font-size: 1rem;
        font-weight: 700;
        font-family: 'Be Vietnam Pro', sans-serif;
        line-height: 1.4;
        box-shadow: 0 8px 18px rgba(21, 94, 232, 0.22), inset 0 1px 0 rgba(255,255,255,0.22);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      }

      .result-footer:hover {
        transform: translateY(-1px);
        filter: brightness(1.04);
        box-shadow: 0 11px 22px rgba(21, 94, 232, 0.27), inset 0 1px 0 rgba(255,255,255,0.22);
      }

      .result-footer:active {
        transform: translateY(0);
      }

      @media (max-width: 480px) {
        .result-header {
          padding: 22px 18px 18px;
        }

        .result-list {
          padding: 0 18px;
        }

        .result-row {
          font-size: 0.82rem;
        }

        .result-footer {
          width: calc(100% - 36px);
          margin: 0 18px 20px;
        }
      }
    </style>
  </head>
  <body>
    <video class="bg-video" autoplay muted loop playsinline>
      <source src="https://videos.files.wordpress.com/T07SD9Eb/ok.mp4" type="video/mp4" />
    </video>

    <div class="result-card">
      <div class="result-header">
        <img
          class="brand-logo-result"
          src="images/LLwin-logo.png"
          alt="LLwin logo"
        />
        <div class="success-title">CHUYỂN THÀNH CÔNG</div>
        <div class="result-date" id="resultDate">Ngày chuyển: --</div>
      </div>

      <div class="result-list">
        <div class="result-row">
          <div class="label">Tài khoản nguồn:</div>
          <div class="value" id="sourceValue">--</div>
        </div>
        <div class="result-row">
          <div class="label">Tài khoản đến:</div>
          <div class="value" id="targetValue">--</div>
        </div>
        <div class="result-row">
          <div class="label">Số điểm chuyển:</div>
          <div class="value red" id="amountValue">--</div>
        </div>
      </div>

      <div class="result-msg">Chúc bạn chơi game vui vẻ!</div>

      <button class="result-footer" id="closeButton" type="button">ĐÓNG</button>
    </div>

    <script>
      const result = JSON.parse(localStorage.getItem('transferResult') || '{}');
      document.getElementById('resultDate').textContent = 'Ngày chuyển: ' + (result.transferDate || '--');
      document.getElementById('sourceValue').textContent = result.sourceAccount || '--';
      document.getElementById('targetValue').textContent = result.targetAccount || '--';
      document.getElementById('amountValue').textContent = result.amount ? result.amount.toLocaleString('vi-VN') : '--';

      document.getElementById('closeButton').addEventListener('click', () => {
        window.location.href = 'index.html';
      });
    </script>
  </body>
</html>
